<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataGen Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="layout">
    <!-- LEFT: Config -->
    <div class="panel" id="panel-config">
      <h2>Configuration</h2>

      <label>Master Topic
        <input type="text" id="topic" placeholder="e.g. TypeScript" value="TypeScript" />
      </label>

      <label>Seed Topics (how many subtopics to start with)
        <input type="number" id="num-seed" value="10" min="2" max="50" />
      </label>

      <label>Max Outputs
        <input type="number" id="max-outputs" value="20" min="1" />
      </label>

      <label>Dataset Type
        <select id="dataset-type">
          <option value="multi_turn">Multi Turn</option>
          <option value="single_turn">Single Turn</option>
        </select>
      </label>

      <label>Output Format
        <select id="format">
          <!-- filled by JS -->
        </select>
      </label>

      <label>Output File
        <input type="text" id="output-file" value="output.jsonl" />
      </label>

      <label>Groq API Keys (one per line)
        <textarea id="api-keys" rows="5"></textarea>
      </label>

      <div class="btn-row">
        <button class="btn-start" id="btn-start">▶ Start Generation</button>
        <button class="btn-stop" id="btn-stop" disabled>■ Stop</button>
      </div>
    </div>

    <!-- RIGHT: Status -->
    <div class="panel" id="panel-status">
      <div class="status-box">
        <h1 class="status-msg">Dataset will be generated and downloaded automatically.</h1>
        <div class="status-stat">Records added: <span id="stat-records">0</span></div>
        <div class="status-stat">Currently generating: <span id="stat-topic">Waiting to start...</span></div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
